[package]
name = "tower-sessions-file-based-store"
description = "File-based session store for `tower-sessions`: one JSON file per session, atomic writes, expiry enforced on read, and a sweep for expired sessions."
authors = ["Max Katz <max.katz@gmail.com>"]
license = "MIT"
homepage = "https://github.com/maxk42/tower-sessions-file-store"
repository = "https://github.com/maxk42/tower-sessions-file-store"
keywords = ["axum", "sessions", "tower", "file", "tower-sessions"]
categories = ["asynchronous", "network-programming", "web-programming"]
version = "0.2.0"
edition = "2021"
readme = "README.md"


[dependencies]
async-trait = "0.1.86"
serde_json = "1.0.133"
time = "0.3.29"
tokio = { version = "1.32", features = ["rt"] }
tower-sessions-core = { version = "0.15.0", features = ["deletion-task"] }
tracing = "0.1.40"

[dev-dependencies]
tokio = { version = "1.32", features = ["macros", "rt-multi-thread"] }
tower-sessions = "0.15.0"
